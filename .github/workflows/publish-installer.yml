name: Publish installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/public/install-xray.sh"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage installer for Pages
        run: |
          mkdir -p /tmp/xray-installer
          cp scripts/public/install-xray.sh /tmp/xray-installer/install-xray.sh

          # Alias: serve the same installer under /node
          cp scripts/public/install-xray.sh /tmp/xray-installer/node

          # Disable Jekyll processing so files without extensions are served as-is
          touch /tmp/xray-installer/.nojekyll

          # Plain 404 to override the inherited user-site SPA 404.html,
          # which would otherwise redirect every missing page into a loop.
          cat > /tmp/xray-installer/404.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>404 - Not Found</title>
          </head>
          <body>
            <h1>404 - Not Found</h1>
            <p>The requested page does not exist.</p>
            <p><a href="/outless/">Back to Outless</a></p>
          </body>
          </html>
          EOF

      - name: Generate custom index
        run: |
          python3 - <<'PY'
          from textwrap import dedent
          from datetime import datetime, timezone

          files = [
            ('install-xray.sh', 'Installer script'),
            ('node', 'Alias for the installer (used as /node)'),
          ]

          rows = []
          for name, desc in files:
            size = f'{len(open(f"/tmp/xray-installer/{name}", "rb").read()) / 1024:.2f} KB'
            rows.append(f'<tr><td><a href="{name}">{name}</a></td><td>{desc}</td><td>{size}</td></tr>')

          html = dedent(f'''
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Outless Installer</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: #eee; margin: 0; padding: 2rem; }}
              .container {{ max-width: 800px; margin: 0 auto; }}
              h1 {{ margin-bottom: 0.25rem; }}
              .hint {{ color: #888; margin-bottom: 2rem; }}
              code {{ background: #222; padding: 0.15rem 0.4rem; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, monospace; }}
              table {{ width: 100%; border-collapse: collapse; margin-top: 1rem; }}
              th, td {{ text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid #333; }}
              th {{ color: #aaa; font-weight: 600; }}
              a {{ color: #4ea8ff; text-decoration: none; }}
              a:hover {{ text-decoration: underline; }}
              .cmd {{ background: #1a1a1a; padding: 1rem; border-radius: 8px; margin-top: 2rem; overflow-x: auto; }}
              .cmd pre {{ margin: 0; color: #0f0; }}
              footer {{ margin-top: 3rem; color: #666; font-size: 0.875rem; }}
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Outless Installer</h1>
              <p class="hint">Generated {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}</p>

              <table>
                <thead>
                  <tr><th>Name</th><th>Description</th><th>Size</th></tr>
                </thead>
                <tbody>
                  {''.join(rows)}
                </tbody>
              </table>

              <div class="cmd">
                <pre>curl -fsSL https://quonaro.github.io/Outless/node | bash</pre>
              </div>

              <footer>Repository quonaro/Outless</footer>
            </div>
          </body>
          </html>
          ''')

          with open('/tmp/xray-installer/index.html', 'w', encoding='utf-8') as f:
            f.write(html.lstrip())
          PY

      - name: Deploy to xray-installer branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: xray-installer
          publish_dir: /tmp/xray-installer
          force_orphan: true
